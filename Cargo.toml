[workspace]
members = ["backend-rs-native", "native-sim", "ios/native-sim-ffi"]
default-members = ["backend-rs-native"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package.odds]
opt-level = 3

[profile.dev.package.native-sim]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
